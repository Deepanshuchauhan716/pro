<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — APIBreak</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

    <nav class="navbar">
        <div class="nav-brand">
            <span class="nav-logo">⚡</span>
            <span class="nav-title">APIBreak</span>
        </div>
    
        <ul class="nav-links" id="navLinks">
            <li><a href="dashboard.html" class="active">Dashboard</a></li>
            <li><a href="logs.html">Logs</a></li>
            <li><a href="endpoints.html">Endpoints</a></li>
            <li><a href="alert.html">Alerts</a></li>
            <li><a href="demo.html">Demo</a></li>
            <li><a href="landingpage.html">Home</a></li>
        </ul>
    
        <div class="nav-right">
            <div class="nav-status">
                <span class="live-dot"></span> LIVE
            </div>
    
            <div class="nav-user">
                <span class="user-name" id="userName">User</span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
    
            <button class="nav-toggle" onclick="toggleNav()">☰</button>
        </div>
    </nav>
    <div class="dashboard-header">
        <h1>📊 Dashboard</h1>
        <button onclick="exportPDF()" class="btn-export">
            📄 Export PDF
        </button>
    </div>
    <div class="container">

        <div class="box total">
            <div class="stat-label">TOTAL</div>
            <div class="stat-value" id="totalValue">0</div>
        </div>

        <div class="box fail">
            <div class="stat-label">FAIL</div>
            <div class="stat-value" id="failValue">0</div>
        </div>

        <div class="box average">
            <div class="stat-label">AVERAGE</div>
            <div class="stat-value" id="avgValue">0</div>
        </div>

        <div class="box slowest">
            <div class="stat-label">SLOWEST</div>
            <div class="stat-value" id="slowestValue">0</div>
        </div>

        <!-- CHART -->
        <div class="box request">
            <div class="stat-label">📈 REQUEST LATENCY OVER TIME</div>
            <div class="chart-wrapper">
                <canvas id="timeChart"></canvas>
            </div>
        </div>

        <!-- SLOWEST ENDPOINTS -->
        <div class="box endpoint">
            <div class="stat-label">🐌 SLOWEST ENDPOINTS</div>
            <div id="slowestList"></div>
        </div>

        <!-- RECENT ISSUES -->
        <div class="box issue">
            <div class="stat-label">🚨 RECENT ISSUES</div>
            <div id="recentIssues"></div>
        </div>

        <!-- LIVE FEED -->
        <div class="box live-feed">
            <div class="stat-label">📋 LIVE FEED</div>
            <div id="liveFeed"></div>
        </div>

    </div>

    <script src="auth.js"></script>
    <script>
        const user = requireAuth();
        if (user) {
            document.getElementById('userName').innerText = user.name;
        }
    </script>

    <script src="dashScript.js"></script>
    <script>
        function toggleNav() {
            document.getElementById('navLinks').classList.toggle('active');
        }
    </script>

    
</body>

</html>
